name: Build Signed AAB + APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare keystore (secret or generated fallback)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using release keystore from ANDROID_KEYSTORE_BASE64 secret."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            echo "SIGNING_MODE=release-secret" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - generating a temporary keystore. The resulting AAB/APK is NOT Play-Store upload compatible unless this keystore matches your Play signing key."
            STORE_PASS="ashapura-temp"
            KEY_ALIAS="ashapura-temp"
            KEY_PASS="ashapura-temp"
            keytool -genkeypair -v \
              -keystore android/release.keystore \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Ashapura Samrat, OU=Build, O=Ashapura, L=NA, S=NA, C=IN"
            echo "SIGNING_MODE=temporary-generated" >> "$GITHUB_ENV"
          fi
          cat > android/keystore.properties << EOF
          storeFile=release.keystore
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build AAB and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Signing summary
        if: always()
        run: echo "Signing mode: ${SIGNING_MODE:-unknown}" >> $GITHUB_STEP_SUMMARY


      - name: Clean up keystore
        if: always()
        run: rm -f android/release.keystore android/keystore.properties

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
