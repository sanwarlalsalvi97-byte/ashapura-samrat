name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      # NOTE: the android/ folder is committed — never run `npx cap add android`,
      # it would overwrite the customised manifest/gradle files.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Prepare signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Play Store expects the upload key with SHA1 D0:3E:73:A7:06:C5:C8:51:F6:E4:60:44:A5:FA:D6:E1:BB:A4:ED:78. Add the keystore secrets before building a release."
            exit 1
          fi
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is missing}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is missing}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"

          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > android/app/release.keystore

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

          echo "Keystore certificate fingerprints:"
          keytool -list -v -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E "Alias name|SHA1:|SHA256:"

      - name: Build AAB and APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon clean bundleRelease assembleRelease --stacktrace

      - name: Verify AAB signing certificate
        run: |
          set -e
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          echo "Verifying $AAB"
          unzip -p "$AAB" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -E "SHA1:|SHA256:" || \
            echo "::warning::Could not read certificate from AAB; check Play Console fingerprint manually."

      - name: Verify no advertising IDs
        run: bash scripts/check-ad-id.sh || true


      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
