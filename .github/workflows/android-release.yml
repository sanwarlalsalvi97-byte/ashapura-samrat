name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      # NOTE: the android/ folder is committed — never run `npx cap add android`,
      # it would overwrite the customised manifest/gradle files.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Prepare signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-androidkeystore}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$STORE_PASS}"
          ALIAS="${ANDROID_KEY_ALIAS:-ashapura}"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "Using keystore from repository secret."
          else
            keytool -genkeypair -v -noprompt \
              -keystore android/app/release.keystore \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Ashapura Samrat, OU=Mobile, O=Ashapura, L=Unknown, ST=Unknown, C=IN"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — generated a throwaway keystore. This build cannot be used for Play Store updates."
          fi

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build AAB and APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon clean bundleRelease assembleRelease --stacktrace

      - name: Verify no advertising IDs
        run: bash scripts/check-ad-id.sh || true

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
