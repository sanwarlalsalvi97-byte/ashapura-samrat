name: Build Android Release

on:
  push:
    branches:
      - main  # या आपकी मुख्य ब्रांच का नाम

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Ensure android/app directory exists
        run: mkdir -p android/app

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare keystore (secret or generated fallback)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/app
          
          # यदि बेस64 सीक्रेट उपलब्ध है तो डिकोड करें, वरना नया कीस्टोर सही पाथ पर बनाएं
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
                      keytool -genkey -v -keystore android/app/release.keystore \
            -alias "${ANDROID_KEY_ALIAS:-my-key-alias}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${ANDROID_KEYSTORE_PASSWORD:-androidkeystore}" \
            -keypass "${ANDROID_KEY_PASSWORD:-androidkeystore}" \
            -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=US"

          fi

      - name: Build AAB and APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease



