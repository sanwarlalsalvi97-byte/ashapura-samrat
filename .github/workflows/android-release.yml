name: Android Release (AAB + APK)

# Builds a signed Android App Bundle (Play Store) and a signed universal APK
# (side-load / QA) for Ashapura Samrat.
#
# Trigger:
#   - Push a tag like `v1.0.0`  →  full release build, artifacts uploaded
#   - Manual `workflow_dispatch` from the Actions tab
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of ashapura-release.keystore  (`base64 -w0 ashapura-release.keystore`)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias (e.g. `ashapura`)
#   ANDROID_KEY_PASSWORD      key password
#
# Outputs (downloadable from the workflow run):
#   app-release.aab   — upload to Play Console
#   app-release.apk   — side-load / share for QA

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    name: Build signed AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform (if absent)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Capacitor sync
        run: npx cap sync android

       - name: Verify keystore
  run: |
    test -f "${{ github.workspace }}/ashapura-release.keystore"

      - name: Write keystore.properties
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=${{ github.workspace }}/ashapura-release.keystore
          storePassword=${STORE_PW}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PW}
          EOF

      - name: Patch app/build.gradle with signingConfig (idempotent)
        run: |
          f=android/app/build.gradle
          if ! grep -q "keystore.properties" "$f"; then
            # Insert loader above `android {`
            awk '
              /^android \{/ && !done {
                print "def keystorePropertiesFile = rootProject.file(\"keystore.properties\")"
                print "def keystoreProperties = new Properties()"
                print "if (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }"
                print ""
                done=1
              }
              { print }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"

            # Insert signingConfigs + release buildType block after first `android {`
            python3 - "$f" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          block = """
              signingConfigs {
                  release {
                      if (keystoreProperties['storeFile']) {
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          """
          s = re.sub(r"(android\s*\{\s*\n)", r"\1" + block, s, count=1)
          open(p, "w").write(s)
          PY
          fi
          cat "$f"

      - name: Ensure UPI <queries> block in AndroidManifest.xml
        run: |
          m=android/app/src/main/AndroidManifest.xml
          if ! grep -q "<queries>" "$m"; then
            python3 - "$m" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          block = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="upi" />
                  </intent>
                  <package android:name="com.google.android.apps.nbu.paisa.user" />
                  <package android:name="com.phonepe.app" />
                  <package android:name="net.one97.paytm" />
                  <package android:name="in.org.npci.upiapp" />
              </queries>
          """
          s = s.replace("</manifest>", block + "\n</manifest>")
          open(p, "w").write(s)
          PY
          fi
          grep -c "com.phonepe.app" "$m"

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/app-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk out/app-release.apk || \
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: out/app-release.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/app-release.aab
            out/app-release.apk
